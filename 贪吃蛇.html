<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a110c">
<title>霓虹贪吃蛇</title>
<style>
:root{color-scheme:dark;--accent:#b5f77b;--accent2:#62d9b4;--rgb:181,247,123;--food:#ffb66e}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#080e0e;color:#eff5ee;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
body{min-height:100svh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at 50% 35%,rgba(46,91,69,.17),transparent 48%),#080e0e}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.app{width:min(100%,820px);margin:auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:36px;height:36px;display:grid;place-items:center;border-radius:12px;background:var(--accent);color:#10180e;font-size:21px;font-weight:950;box-shadow:0 0 25px rgba(var(--rgb),.2)}
.brand-name{font-size:12px;letter-spacing:2.5px;font-weight:900;white-space:nowrap}
.brand-sub{font-size:8px;letter-spacing:2px;color:#728078;margin-top:4px}
.actions{display:flex;gap:7px;align-items:center}
.icon-btn{width:44px;height:44px;border:1px solid rgba(255,255,255,.11);border-radius:50%;background:rgba(255,255,255,.035);color:#c4d0c7;display:grid;place-items:center;font-size:15px;transition:.2s}
.icon-btn:hover,.icon-btn:focus-visible{border-color:rgba(var(--rgb),.6);color:var(--accent);outline:none}
.icon-btn.off{opacity:.48}
.scorebar{display:flex;align-items:center;justify-content:space-between;padding:0 4px;margin-bottom:12px}
.scores{display:flex;gap:36px}
.score{display:flex;flex-direction:column;gap:4px}
.score-label{font-size:8px;letter-spacing:2px;color:#7e8e84}
.score-value{font-size:23px;font-weight:850;letter-spacing:1px;font-variant-numeric:tabular-nums}
.score-value.best{color:var(--accent)}
.level-value{font-size:17px;color:var(--accent);letter-spacing:0;white-space:nowrap}.world-progress{font-size:8px;letter-spacing:1.2px;color:#8a9a8e;margin-top:1px}
.stage-score{min-width:46px}
.pause-btn{width:44px;height:44px;border:1px solid rgba(255,255,255,.12);border-radius:50%;background:rgba(255,255,255,.035);color:#d5dfd7;font-size:14px}
.pause-btn:disabled{opacity:.25;cursor:default}
.arena{position:relative;width:100%;aspect-ratio:1;overflow:hidden;border-radius:25px;background:#0b1513;border:1px solid rgba(255,255,255,.065);box-shadow:0 24px 80px rgba(0,0,0,.45),0 0 65px rgba(var(--rgb),.055)}
canvas{display:block;width:100%;height:100%;touch-action:none}
.overlay{position:absolute;inset:0;z-index:2;display:grid;place-items:center;padding:18px;background:rgba(5,12,10,.55);backdrop-filter:blur(9px);transition:opacity .24s,visibility .24s}
.overlay.hidden{opacity:0;visibility:hidden;pointer-events:none}
.panel{width:min(100%,290px);padding:28px 24px;text-align:center;border:1px solid rgba(255,255,255,.1);border-radius:21px;background:linear-gradient(145deg,rgba(23,37,30,.96),rgba(9,17,14,.97));box-shadow:0 20px 65px rgba(0,0,0,.4)}
.panel-title{font-size:clamp(34px,7vw,46px);font-weight:950;letter-spacing:-1.8px;line-height:1;margin:14px 0 9px}
.difficulty-picker{margin:0 auto 17px;display:flex;align-items:center;justify-content:center;gap:6px}
.difficulty-label{font-size:8px;letter-spacing:1.5px;color:#87968c;margin-right:3px}
.difficulty-btn{min-width:57px;padding:8px 10px;border:1px solid rgba(255,255,255,.13);border-radius:7px;background:rgba(255,255,255,.035);color:#b9c7bd;font-size:10px;letter-spacing:1px;transition:.16s}
.difficulty-btn[aria-pressed="true"]{border-color:var(--accent);background:rgba(var(--rgb),.19);color:var(--accent);box-shadow:inset 0 0 0 1px rgba(var(--rgb),.2),0 0 13px rgba(var(--rgb),.1)}
.difficulty-btn:active{transform:translateY(1px);background:rgba(var(--rgb),.23)}
.difficulty-btn:disabled{opacity:.45;cursor:not-allowed}
.difficulty-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel-score{font-size:12px;color:var(--accent);margin:-5px 0 16px}
.primary{min-height:50px;width:100%;border:0;border-radius:12px;background:var(--accent);color:#102014;font-size:10px;font-weight:950;letter-spacing:2px;padding:15px 12px;box-shadow:0 7px 25px rgba(var(--rgb),.17);transition:transform .2s,box-shadow .2s}
.primary:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(var(--rgb),.28)}
.secondary{min-height:46px;width:100%;margin-top:9px;border:1px solid rgba(255,255,255,.13);border-radius:11px;background:rgba(255,255,255,.035);color:#d3ded5;font-size:9px;letter-spacing:1.5px;padding:12px}
[hidden]{display:none!important}
.bottom{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:58px;padding:12px 3px 0}
.hint{font-size:9px;line-height:2;color:#718078;letter-spacing:.5px}
kbd{display:inline-block;min-width:21px;padding:2px 5px;text-align:center;border:1px solid #34433b;border-radius:5px;background:#121d18;color:#bdcbbf;font-size:9px}
.pad{display:none;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,58px);gap:8px;touch-action:none}
.pad button{border:1px solid rgba(var(--rgb),.34);border-radius:16px;background:linear-gradient(145deg,rgba(var(--rgb),.13),rgba(var(--rgb),.045));color:var(--accent);font-size:26px;font-weight:650;box-shadow:0 7px 20px rgba(0,0,0,.2),inset 0 1px rgba(255,255,255,.07);touch-action:none;user-select:none;-webkit-user-select:none;transition:background .12s,transform .12s,border-color .12s}
.pad button:active{background:rgba(var(--rgb),.25);transform:scale(.96);border-color:rgba(var(--rgb),.7)}
.pad button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.pad .up{grid-column:2;grid-row:1}.pad .left{grid-column:1;grid-row:2}.pad .down{grid-column:2;grid-row:2}.pad .right{grid-column:3;grid-row:2}
.footer{display:flex;justify-content:space-between;margin-top:22px;color:#526158;font-size:8px;letter-spacing:2px}
.footer span{color:var(--accent)}
@media(max-width:620px){
 body{display:block;min-height:100svh;padding:max(8px,env(safe-area-inset-top)) 8px max(12px,env(safe-area-inset-bottom));}
 .app{width:100%;max-width:620px;margin:0 auto}
 .top{margin-bottom:14px;gap:8px}
 .mark{width:38px;height:38px;border-radius:13px}
 .brand-name{font-size:11px;letter-spacing:2px}
 .brand-sub{font-size:7px}
 .actions{gap:7px}
 .icon-btn{width:44px;height:44px;font-size:17px}
 .scorebar{padding:0 3px;margin-bottom:9px}
 .scores{gap:16px}
 .score{gap:3px}
 .score-label{font-size:9px;letter-spacing:1.8px}
 .score-value{font-size:24px}
 .level-value{font-size:17px}
 .pause-btn{width:44px;height:44px;font-size:16px}
 .arena{width:100%;border-radius:18px}
 .bottom{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:13px 0 0;min-height:0}
 .hint{display:none}
 .pad{display:grid;grid-template-columns:repeat(3,clamp(58px,17vw,72px));grid-template-rows:repeat(2,clamp(54px,15vw,66px));gap:8px}
 .pad button{font-size:28px;border-radius:16px}
 .footer{justify-content:center;margin-top:14px;padding-bottom:2px}
 .footer .right{display:none}
 .panel{width:min(100%,320px);padding:27px 23px}
 .panel-title{font-size:clamp(36px,9vw,48px)}
 .primary{min-height:52px;font-size:11px}
 .secondary{min-height:48px;font-size:10px}
}
@media(max-width:370px){
 .top{margin-bottom:11px}
 .brand-name{font-size:10px}
 .icon-btn{width:40px;height:40px}
 .actions{gap:5px}
 .scores{gap:16px}
 .score-value{font-size:22px}
 .level-value{font-size:15px}
 .pad{grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,54px);gap:7px}
 .pad button{font-size:25px;border-radius:14px}
 .panel{padding:23px 18px}
}
@media(orientation:landscape) and (max-height:560px) and (max-width:900px){
 body{padding:6px 10px}
 .app{max-width:1050px;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"top top" "scores scores" "arena controls" "footer footer";column-gap:18px;align-items:center}
 .top{grid-area:top;margin-bottom:7px}
 .scorebar{grid-area:scores;margin-bottom:6px}
 .arena{grid-area:arena;width:min(68vh,calc(100vw - 190px));border-radius:15px}
 .bottom{grid-area:controls;padding:0;min-height:0}
 .hint{display:none}
 .pad{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,44px);gap:6px}
 .pad button{font-size:21px;border-radius:12px}
 .footer{grid-area:footer;margin-top:7px}
 .footer .right{display:none}
}


.collection-overlay{position:fixed;inset:0;z-index:1100;display:grid;place-items:center;padding:16px;background:rgba(3,8,6,.78);backdrop-filter:blur(10px)}
.collection-panel{width:min(100%,520px);max-height:min(82svh,720px);overflow:auto;border:1px solid rgba(255,255,255,.12);border-radius:22px;background:linear-gradient(150deg,#1a2b22,#0b1511 72%);box-shadow:0 28px 90px rgba(0,0,0,.55);padding:20px}
.collection-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}
.collection-title{font-size:17px;font-weight:900;letter-spacing:1px;color:#edf6ed}
.collection-close{width:36px;height:36px;border:1px solid rgba(255,255,255,.12);border-radius:50%;background:rgba(255,255,255,.04);color:#dce8dd;font-size:20px}
.collection-tabs{display:flex;gap:8px;margin-bottom:15px}
.collection-tab{flex:1;min-height:39px;border:1px solid rgba(255,255,255,.12);border-radius:10px;background:rgba(255,255,255,.035);color:#aebeb2;font-size:11px;font-weight:750;letter-spacing:1px}
.collection-tab[aria-selected="true"]{border-color:var(--accent);background:rgba(var(--rgb),.14);color:var(--accent)}
.collection-content{display:grid;gap:10px}
.collection-world{font-size:10px;font-weight:850;letter-spacing:2px;color:var(--accent);margin:8px 0 1px}
.item-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.item-card{min-width:0;padding:12px;border:1px solid rgba(255,255,255,.09);border-radius:13px;background:rgba(255,255,255,.035)}
.item-card.locked{opacity:.55;background:rgba(0,0,0,.14)}
.item-card-top{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:7px}
.item-icon{width:60px;height:60px;flex:0 0 60px;display:grid;place-items:center;overflow:hidden;border-radius:16px;border:1px solid rgba(255,255,255,.13);background:radial-gradient(circle at 34% 24%,rgba(255,255,255,.13),rgba(255,255,255,.035) 58%,rgba(0,0,0,.16));box-shadow:inset 0 1px rgba(255,255,255,.1),0 7px 18px rgba(0,0,0,.16);font-size:22px;color:#b8c8bc}.item-icon svg{display:block;width:54px;height:54px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.24))}.item-icon.is-locked{background:rgba(255,255,255,.035);border-style:dashed;box-shadow:none;color:#819087}.item-card-top{min-height:62px}.item-rarity{align-self:flex-start;padding-top:5px}
.item-rarity{font-size:9px;font-weight:850;letter-spacing:1px}
.item-rarity.common{color:#a9d59a}.item-rarity.rare{color:#76d5ff}.item-rarity.epic{color:#d6a0ff}
.item-name{font-size:12px;font-weight:850;color:#edf5ed;margin-bottom:4px}
.item-desc{font-size:10px;line-height:1.6;color:#91a297;min-height:31px}
.item-count{font-size:9px;color:var(--accent);margin-top:8px}
.achievement-card{display:flex;align-items:center;gap:11px;padding:11px;border:1px solid rgba(255,255,255,.09);border-radius:12px;background:rgba(255,255,255,.035)}
.achievement-card.locked{opacity:.48}
.achievement-icon{width:36px;height:36px;flex:0 0 36px;display:grid;place-items:center;border-radius:11px;background:rgba(var(--rgb),.1);font-size:18px}
.achievement-name{font-size:11px;font-weight:850;color:#edf5ed}
.achievement-desc{font-size:9px;color:#91a297;margin-top:4px;line-height:1.5}
.achievement-state{margin-left:auto;font-size:9px;color:var(--accent);white-space:nowrap}
.collection-summary{font-size:10px;color:#8fa095;letter-spacing:.5px;margin-bottom:2px}
.toast{position:fixed;z-index:40;left:50%;top:max(128px,calc(env(safe-area-inset-top) + 128px));transform:translate(-50%,-10px);padding:11px 17px;border:1px solid rgba(var(--rgb),.38);border-radius:14px;background:linear-gradient(145deg,rgba(20,39,28,.97),rgba(8,19,14,.97));color:#eff8ed;font-size:11px;font-weight:800;line-height:1.55;text-align:center;box-shadow:0 12px 38px rgba(0,0,0,.48),0 0 24px rgba(var(--rgb),.1);opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;width:max-content;max-width:min(460px,calc(100vw - 28px));white-space:normal}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast[data-rarity=rare]{border-color:rgba(118,213,255,.62);box-shadow:0 12px 38px rgba(0,0,0,.48),0 0 24px rgba(118,213,255,.15)}
.toast[data-rarity=epic]{border-color:rgba(214,160,255,.72);box-shadow:0 12px 38px rgba(0,0,0,.48),0 0 28px rgba(214,160,255,.2)}
.item-kind{display:inline-flex;align-items:center;padding:3px 6px;border-radius:6px;background:rgba(255,255,255,.06);color:#aab9ad;font-size:8px;font-weight:800;letter-spacing:.5px}
.item-kind.functional{color:#b5f77b;background:rgba(181,247,123,.09)}
.item-kind.collectible{color:#f2d19a;background:rgba(242,209,154,.09)}
.item-card-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.item-type-label{font-size:9px;font-weight:850;letter-spacing:1.6px;color:#91a59a;margin:3px 0 -4px}
@media(max-width:620px){.collection-panel{padding:16px;border-radius:18px;max-height:84svh}.item-grid{gap:7px}.item-card{padding:10px}.collection-title{font-size:15px}}
@media(max-width:360px){.item-grid{grid-template-columns:1fr}.item-desc{min-height:0}}

@media(prefers-reduced-motion:reduce){*{transition:none!important}}

.mode-picker{display:flex;gap:7px;justify-content:center;margin:-7px auto 15px}
.mode-btn{min-height:34px;padding:7px 13px;border:1px solid rgba(255,255,255,.13);border-radius:9px;background:rgba(255,255,255,.035);color:#b9c7bd;font-size:9px;font-weight:800;letter-spacing:.7px}
.mode-btn[aria-pressed="true"]{border-color:var(--accent);background:rgba(var(--rgb),.14);color:var(--accent)}

.collection-tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}

@media(max-width:430px){.collection-stat-row{grid-template-columns:repeat(2,minmax(0,1fr))}}
.collection-stat{padding:9px;border:1px solid rgba(255,255,255,.08);border-radius:10px;background:rgba(255,255,255,.035)}
.collection-stat strong{display:block;color:var(--accent);font-size:15px}
.collection-stat span{font-size:8px;color:#829187;letter-spacing:.5px}
.collection-section-title{font-size:10px;font-weight:900;letter-spacing:1.6px;color:var(--accent);margin:8px 0 2px}
.task-card,.skin-card{padding:12px;border:1px solid rgba(255,255,255,.09);border-radius:12px;background:rgba(255,255,255,.035)}
.task-top,.skin-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.task-name,.skin-name{font-size:11px;font-weight:850;color:#edf5ed}
.task-desc,.skin-desc{font-size:9px;color:#91a297;line-height:1.6;margin-top:5px}
.task-progress{height:5px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:9px}
.task-progress>i{display:block;height:100%;border-radius:9px;background:var(--accent)}

.trade-btn,.skin-select{border:1px solid rgba(var(--rgb),.32);border-radius:8px;background:rgba(var(--rgb),.09);color:var(--accent);padding:7px 9px;font-size:9px;font-weight:800;margin-top:8px}
.trade-btn:disabled,.skin-select:disabled{opacity:.4;cursor:not-allowed}
.skin-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.skin-swatch{width:100%;height:35px;border-radius:8px;margin:8px 0;background:linear-gradient(100deg,var(--skin-a),var(--skin-b))}
.toast[data-rarity=legendary]{border-color:rgba(242,203,119,.85);box-shadow:0 12px 38px rgba(0,0,0,.5),0 0 34px rgba(242,203,119,.3)}
@media(max-width:430px){.collection-panel{padding:14px}.collection-tabs{gap:5px}.collection-tab{font-size:9px;min-height:36px}.mode-btn{padding:7px 10px}}



/* ================= V10 PIXEL ART UNIFICATION ================= */
:root{--pixel-ink:#09110b;--pixel-panel:#142319;--pixel-line:#557447;--pixel-hi:#d7f1a4}

/* ================= PIXEL RPG TITLE / LAUNCH SCREEN ================= */
.launch-screen{
 position:fixed;inset:0;z-index:1000;display:grid;place-items:center;overflow:auto;
 padding:clamp(12px,3vw,30px);
 background:
  radial-gradient(ellipse at 50% 22%,rgba(122,158,101,.19),transparent 36%),
  radial-gradient(ellipse at 50% 100%,rgba(173,124,68,.12),transparent 44%),
  linear-gradient(145deg,#081310,#101e1b 52%,#080f12);
 transition:opacity .42s ease,visibility .42s ease;
}
.launch-screen::before,.launch-screen::after{content:"";position:fixed;inset:0;pointer-events:none}
.launch-screen::before{
 opacity:.23;background-image:linear-gradient(rgba(190,211,151,.10) 1px,transparent 1px),linear-gradient(90deg,rgba(190,211,151,.10) 1px,transparent 1px);
 background-size:32px 32px;mask-image:linear-gradient(transparent,#000 20%,#000 78%,transparent);
}
.launch-screen::after{background:radial-gradient(ellipse at center,transparent 35%,rgba(0,0,0,.48) 100%)}
.launch-screen.leaving{opacity:0;visibility:hidden;pointer-events:none}
.launch-frame{
 position:relative;z-index:1;width:min(900px,100%);max-height:calc(100svh - 28px);overflow:auto;
 border:2px solid #b69a61;border-radius:5px;padding:clamp(16px,3vw,28px);
 background:linear-gradient(155deg,rgba(31,54,43,.98),rgba(15,32,29,.98) 55%,rgba(10,22,23,.99));
 box-shadow:inset 0 0 0 3px #293e32,inset 0 0 0 5px rgba(5,13,12,.8),0 14px 0 #050a09,0 28px 90px rgba(0,0,0,.68);
}
.launch-frame::before{content:"";position:absolute;inset:8px;border:1px solid rgba(218,188,123,.30);pointer-events:none}
.launch-topline,.launch-bottomline{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;gap:12px;color:#c5b27c;font:700 9px ui-monospace,Consolas,monospace;letter-spacing:2px}
.launch-topline span:last-child{color:#819a83}
.launch-brand{position:relative;z-index:1;text-align:center;padding:clamp(15px,3vh,27px) 8px 8px}
.launch-emblem{width:54px;height:54px;margin:0 auto 12px;display:grid;place-items:center;border:2px solid #d9bd7d;background:linear-gradient(145deg,#536f4a,#203d32);box-shadow:inset 0 0 0 3px #1b3027,4px 5px 0 #07100c;color:#f1dfad}
.launch-emblem svg{width:34px;height:34px;shape-rendering:crispEdges}
.launch-eyebrow{margin:0 0 9px;color:#d5bc7c;font:800 9px ui-monospace,Consolas,monospace;letter-spacing:4px}
.launch-title{margin:0;color:#f0e4c2;font:950 clamp(36px,7vw,66px)/.98 ui-monospace,Consolas,monospace;letter-spacing:clamp(1px,.6vw,5px);text-shadow:0 4px 0 #334a37,3px 7px 0 rgba(0,0,0,.48)}
.launch-title span{color:#d7b96e}
.launch-subtitle{margin:12px 0 0;color:#bdc8ad;font-size:clamp(11px,1.7vw,14px);letter-spacing:3px;font-weight:750}
.launch-art-wrap{position:relative;z-index:1;width:min(100%,760px);margin:12px auto 10px;border:2px solid #7f8159;background:#1b332d;box-shadow:inset 0 0 0 3px #142820,0 6px 0 #07100c;overflow:hidden}
.launch-art{display:block;width:100%;height:auto;image-rendering:pixelated;shape-rendering:crispEdges}
.launch-spark{position:absolute;width:4px;height:4px;background:#f1d993;box-shadow:0 0 10px #f1d993;animation:launchTwinkle 1.8s steps(2,end) infinite}
.launch-spark.one{left:14%;top:25%}.launch-spark.two{right:18%;top:19%;animation-delay:.6s}.launch-spark.three{right:31%;bottom:21%;animation-delay:1.1s}
@keyframes launchTwinkle{0%,100%{opacity:.28;transform:scale(.7)}50%{opacity:1;transform:scale(1.35)}}
.launch-worlds{position:relative;z-index:1;display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:15px auto 19px}
.launch-world-chip{border:1px solid rgba(190,172,112,.45);background:rgba(7,17,14,.52);padding:7px 11px;color:#c6c9a7;font:700 9px ui-monospace,Consolas,monospace;letter-spacing:1px;box-shadow:inset 0 1px rgba(255,255,255,.06)}
.launch-world-chip b{color:#e0c783;margin-right:5px}
.launch-actions{position:relative;z-index:1;display:grid;justify-items:center;gap:9px;padding-bottom:5px}
.launch-enter{
 width:min(320px,100%);min-height:54px;border:2px solid #f0d89b;border-radius:3px;
 background:linear-gradient(180deg,#e0c985,#ae8c4d);color:#1a2a20;
 box-shadow:inset 0 1px 0 #fff1c2,inset 0 -4px 0 rgba(87,61,30,.22),5px 6px 0 #060d0a,0 0 28px rgba(210,179,108,.16);
 font:950 12px ui-monospace,Consolas,monospace;letter-spacing:3px;cursor:pointer;transition:transform .12s,filter .12s;
}
.launch-enter:hover{filter:brightness(1.09);transform:translateY(-2px)}
.launch-enter:active{transform:translate(2px,3px);box-shadow:inset 0 1px 0 #fff1c2,2px 3px 0 #060d0a}
.launch-enter:focus-visible{outline:3px solid #f3e4b5;outline-offset:5px}
.launch-enter span{display:inline-block;margin-left:12px;font-size:10px}
.launch-note{margin:0;color:#829486;font:700 8px ui-monospace,Consolas,monospace;letter-spacing:1.6px;text-align:center}
.launch-bottomline{margin-top:20px;padding-top:11px;border-top:1px solid rgba(211,180,111,.18);font-size:8px;color:#829180}
.launch-bottomline strong{color:#d1b775;font-weight:800}
@media(max-width:600px){
 .launch-screen{padding:8px}.launch-frame{max-height:calc(100svh - 16px);padding:14px 12px 12px}
.launch-brand{padding:13px 4px 4px}.launch-emblem{width:44px;height:44px;margin-bottom:9px}
.launch-subtitle{letter-spacing:1.5px;margin-top:8px}
 .launch-art-wrap{margin:10px auto 8px}.launch-worlds{gap:5px;margin:10px auto 13px}.launch-world-chip{padding:6px 8px;font-size:8px;letter-spacing:.4px}
 .launch-enter{min-height:50px}.launch-bottomline{font-size:7px;letter-spacing:.6px;margin-top:13px}
}
@media(max-height:680px) and (min-width:601px){.launch-brand{padding-top:12px}.launch-emblem{width:42px;height:42px;margin-bottom:7px}.launch-art-wrap{max-width:620px;margin:7px auto}.launch-worlds{margin:9px auto 11px}}
@media(prefers-reduced-motion:reduce){.launch-screen,.launch-enter,.launch-spark{transition:none;animation:none}}

/* V11 usability polish */

/* ================= V14 MOBILE LAYOUT ================= */
/* Portrait phones: use the full device width and reclaim space around the board.
   Keep the board square so the grid cells and pixel sprites are not distorted. */
@media (max-width: 620px) and (orientation: portrait) {
  html, body {
    width: 100%;
    min-height: 100%;
    overflow-x: hidden;
    overscroll-behavior: none;
  }
  body {
    display: block;
    min-height: 100svh;
    padding:
      max(4px, env(safe-area-inset-top))
      0
      max(8px, env(safe-area-inset-bottom));
  }
  .app {
    width: 100%;
    max-width: none;
    min-height: calc(100svh - env(safe-area-inset-top) - env(safe-area-inset-bottom));
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    justify-content: flex-start;
    gap: 0;
  }
  .scorebar {
    flex: 0 0 auto;
    margin: 0 5px 6px !important;
    padding: 6px 9px !important;
    min-height: 48px;
  }
  .scores {
    flex: 1 1 auto;
    gap: clamp(12px, 4.4vw, 22px) !important;
  }
  .score { gap: 2px; }
  .score-label { font-size: 8px !important; letter-spacing: 1px !important; }
  .score-value { font-size: clamp(19px, 5.7vw, 24px) !important; line-height: 1.05; }
  .level-value { font-size: clamp(14px, 4.2vw, 17px) !important; }
  .world-progress { font-size: 8px !important; letter-spacing: 0 !important; }
  .pause-btn { flex-basis: 40px; width: 40px; height: 40px; }
  .arena {
    flex: 0 0 auto;
    width: min(100vw, calc(100svh - 202px));
    max-width: 100vw;
    aspect-ratio: 1 / 1;
    margin: 0 auto;
    border-width: 3px !important;
    box-shadow: 4px 5px 0 #04090b, 0 0 0 1px #3d5141 !important;
    touch-action: none;
  }
  canvas {
    width: 100%;
    height: 100%;
    touch-action: none;
  }
  .bottom {
    flex: 0 0 auto;
    width: 100%;
    min-height: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 8px 0 max(4px, env(safe-area-inset-bottom)) !important;
    gap: 0;
  }
  .control-hint { display: none !important; }
  .pad {
    display: grid;
    grid-template-columns: repeat(3, clamp(62px, 18vw, 76px));
    grid-template-rows: repeat(2, clamp(50px, 13.5vw, 62px));
    gap: 7px;
    margin: 0;
  }
  .pad button {
    min-width: 0;
    min-height: 48px;
    font-size: clamp(23px, 7vw, 29px);
    border-width: 2px !important;
    box-shadow: 3px 4px 0 #050b0d !important;
    touch-action: none;
  }
  .toast {
    top: max(68px, calc(env(safe-area-inset-top) + 62px));
    max-width: calc(100vw - 24px);
    font-size: 10px;
    padding: 9px 12px;
  }
}

/* Landscape phones: place the larger square arena on the left and thumb controls
   on the right. This fixes the old 68vh sizing, which made the playfield too small. */
@media (max-width: 900px) and (max-height: 620px) and (orientation: landscape) {
  html, body {
    width: 100%;
    height: 100%;
    min-height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
  }
  body {
    display: block;
    min-height: 100svh;
    padding:
      max(4px, env(safe-area-inset-top))
      max(6px, env(safe-area-inset-right))
      max(4px, env(safe-area-inset-bottom))
      max(6px, env(safe-area-inset-left));
  }
  .app {
    width: 100%;
    max-width: none;
    height: calc(100svh - env(safe-area-inset-top) - env(safe-area-inset-bottom));
    min-height: 0;
    margin: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr) clamp(132px, 21vw, 176px);
    grid-template-rows: auto minmax(0, 1fr);
    grid-template-areas:
      "hud hud"
      "arena controls";
    align-items: center;
    column-gap: 8px;
    row-gap: 5px;
  }
  .scorebar {
    grid-area: hud;
    width: 100%;
    margin: 0 !important;
    padding: 4px 8px !important;
    min-height: 42px;
  }
  .scores { gap: clamp(12px, 3vw, 25px) !important; }
  .score-label { font-size: 8px !important; }
  .score-value { font-size: clamp(17px, 3.5vh, 22px) !important; }
  .level-value { font-size: clamp(13px, 3vh, 16px) !important; }
  .world-progress { font-size: 7px !important; }
  .pause-btn { width: 38px; height: 38px; flex-basis: 38px; }
  .arena {
    grid-area: arena;
    width: min(calc(100svh - 66px), calc(100vw - 158px));
    max-width: 100%;
    max-height: calc(100svh - 66px);
    aspect-ratio: 1 / 1;
    justify-self: center;
    align-self: center;
    border-width: 3px !important;
    touch-action: none;
  }
  canvas { width: 100%; height: 100%; touch-action: none; }
  .bottom {
    grid-area: controls;
    width: 100%;
    min-height: 0;
    padding: 0 !important;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .control-hint { display: none !important; }
  .pad {
    display: grid;
    grid-template-columns: repeat(3, clamp(38px, 9vw, 52px));
    grid-template-rows: repeat(2, clamp(36px, 10vh, 48px));
    gap: 5px;
    margin: 0;
  }
  .pad button {
    min-width: 0;
    min-height: 36px;
    font-size: clamp(18px, 4.2vh, 24px);
    border-width: 1px !important;
    box-shadow: 2px 3px 0 #050b0d !important;
    touch-action: none;
  }
  .toast {
    top: max(48px, calc(env(safe-area-inset-top) + 44px));
    max-width: min(60vw, 420px);
    font-size: 9px;
    padding: 7px 10px;
  }
}
/* ================= END V14 MOBILE LAYOUT ================= */

function obstacleLayoutIsValid(cells){

 for(const p of snake.slice(1))blocked.add(p.x+','+p.y);
 const start=snake[0],queue=[start],seen=new Set([start.x+','+start.y]);
 let exitReached=false;
 for(let i=0;i<queue.length;i++){
  const p=queue[i];
  if(p.x===exit.x&&p.y===exit.y)exitReached=true;
  for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
   const x=p.x+dx,y=p.y+dy,key=x+','+y;
   if(x<1||x>GRID-2||y<2||y>GRID-2||blocked.has(key)||seen.has(key))continue;
   seen.add(key);queue.push({x,y});
  }
 }
 const openCount=(GRID-2)*(GRID-3)-cells.length-(snake.length-1);

function itemIconSvg(item){
 const id=item&&item.id?item.id:'',world=id.startsWith('snow_')?'snow':id.startsWith('desert_')?'desert':'grass',p=ITEM_ICON_PALETTES[world];
 const safe=id.replace(/[^a-z0-9_-]/gi,'')||'item',g='item-'+safe;
 const art=(ITEM_ICON_ART[id]||ITEM_ICON_ART.grass_seed).replaceAll('$D',p.dark).replaceAll('$M',p.mid).replaceAll('$L',p.light).replaceAll('$A',p.accent).replaceAll('$G',`url(#${g}-metal)`);
 return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="${item.name}"><defs><linearGradient id="${g}-metal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${p.light}"/><stop offset=".48" stop-color="${p.mid}"/><stop offset="1" stop-color="${p.deep}"/></linearGradient><radialGradient id="${g}-shine" cx=".3" cy=".2" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".24"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs><circle cx="32" cy="32" r="29" fill="${p.dark}" opacity=".16"/><circle cx="32" cy="32" r="27" fill="url(#${g}-shine)"/><g stroke-linecap="round" stroke-linejoin="round">${art}</g><path d="M13 18Q18 9 27 8" fill="none" stroke="#fff" stroke-opacity=".34" stroke-width="2" stroke-linecap="round"/></svg>`;
}

function v10Toast(message,rarity='common'){

 const next=()=>{

  toastBusy=true;
  const item=toastQueue.shift(),el=$('toast');
  el.textContent=item.message;el.dataset.rarity=item.rarity||'common';el.classList.add('show');
  clearTimeout(toastTimer);

 };
 next();

function v10RarityRoll(){
 const worldKey=['grass','snow','desert'][worldIndex];
 const legendReady=!!collection.legendUnlocked[worldKey];
 if(collection.epicMisses>=12){
  const top=MAP_ITEMS[worldIndex].filter(i=>i.rarity==='epic'||(i.rarity==='legendary'&&legendReady));
  const chosen=top[Math.floor(Math.random()*top.length)]||MAP_ITEMS[worldIndex].find(i=>i.rarity==='epic');
  collection.epicMisses=0;v10Save();return chosen;
 }
 let weights=[['common',65],['rare',27],['epic',7],['legendary',legendReady?1:0]];
 let roll=Math.random()*weights.reduce((s,x)=>s+x[1],0),rarity='common';
 for(const [r,w] of weights){roll-=w;if(roll<0){rarity=r;break;}}
 let pool=MAP_ITEMS[worldIndex].filter(i=>i.rarity===rarity);
 if(!pool.length)pool=MAP_ITEMS[worldIndex].filter(i=>i.rarity==='common');
 const undiscovered=pool.filter(i=>!(collection.items[i.id]||0));
 const choices=undiscovered.length?undiscovered:pool;
 const chosen=choices[Math.floor(Math.random()*choices.length)];
 if(chosen.rarity==='epic'||chosen.rarity==='legendary')collection.epicMisses=0;
 else collection.epicMisses++;
 v10Save();
 return chosen;
}
chooseRandomRelic=v10RarityRoll;

function v10SpawnFood(){
 const exit=WORLDS[worldIndex].exit;
 const occupied=new Set([...snake,...obstacles,{x:exit.x,y:exit.y}].map(p=>p.x+','+p.y));
 if(relic)occupied.add(relic.x+','+relic.y);
 const free=[];
 for(let y=2;y<GRID-1;y++)for(let x=1;x<GRID-1;x++)if(!occupied.has(x+','+y))free.push({x,y});
 return free.length?free[Math.floor(Math.random()*free.length)]:null;
}

 const blocked=new Set([...snake,...obstacles,{x:WORLDS[worldIndex].exit.x,y:WORLDS[worldIndex].exit.y}].map(p=>p.x+','+p.y));

 const free=[];
 for(let y=2;y<GRID-1;y++)for(let x=1;x<GRID-1;x++)if(!blocked.has(x+','+y))free.push({x,y});

}

function v10MakeOrganicObstacleLayout(){
 const rules=DIFFICULTIES[difficulty];
 let min=rules.min,max=rules.max;
 if(gameMode==='endless'&&endlessLoop>0){const cap=MAP_SIZE_CONFIGS[GRID].endlessObstacleCap;min=Math.min(cap,min+endlessLoop);max=Math.min(cap,max+endlessLoop*2);}
 const target=randomInt(min,max);
 let layout=v10OriginalFunctions.makeOrganicObstacleLayout().slice();
 // Trim any overshoot while preserving full-board connectivity.
 while(layout.length>target){
  let removed=false;
  const order=Array.from({length:layout.length},(_,i)=>i);
  for(let i=order.length-1;i>0;i--){const j=randomInt(0,i);[order[i],order[j]]=[order[j],order[i]];}
  for(const index of order){
   const candidate=layout.slice();candidate.splice(index,1);
   if(obstacleLayoutIsValid(candidate)){layout=candidate;removed=true;break;}
  }
  if(!removed)break;
 }
 // The V9 generator allowed a two-cell shortfall; fill only with cells that
 // preserve connectivity, keeping the configured count exact whenever possible.
 const candidates=[];
 for(let y=3;y<=GRID-3;y++)for(let x=2;x<=GRID-3;x++)candidates.push({x,y});
 for(let i=candidates.length-1;i>0;i--){const j=randomInt(0,i);[candidates[i],candidates[j]]=[candidates[j],candidates[i]];}
 for(const p of candidates){
  if(layout.length>=target)break;
  if(layout.some(q=>q.x===p.x&&q.y===p.y))continue;
  if(snake.some(q=>q.x===p.x&&q.y===p.y))continue;
  if(Math.abs(p.x-snake[0].x)+Math.abs(p.y-snake[0].y)<4)continue;
  if(Math.abs(p.x-WORLDS[worldIndex].exit.x)+Math.abs(p.y-WORLDS[worldIndex].exit.y)<2)continue;
  const candidate=layout.concat([p]);
  if(obstacleLayoutIsValid(candidate))layout=candidate;
 }
 return layout;
}

function v10Tick(){
 if(state!=='playing')return;
 dir={...nextDir};
 const before={snake:snake.map(p=>({...p})),dir:{...dir}};
 let head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
 let atExit=head.x===WORLDS[worldIndex].exit.x&&head.y===WORLDS[worldIndex].exit.y;
 let eating=!!food&&head.x===food.x&&head.y===food.y;
 let collecting=!!relic&&head.x===relic.x&&head.y===relic.y;
 let body=(eating||growPending>0)?snake:snake.slice(0,-1);
 const wallCollision=head.x<=0||head.x>=GRID-1||head.y<=1||head.y>=GRID-1;
 const selfCollision=body.some(p=>p.x===head.x&&p.y===head.y);
 const obstacleCollision=obstacles.some(p=>p.x===head.x&&p.y===head.y);
 let collision=wallCollision||selfCollision||(obstacleCollision&&phaseCharges<=0)||(atExit&&!exitOpen);
 const phasePassing=obstacleCollision&&phaseCharges>0&&!wallCollision&&!selfCollision;
 if(phasePassing){phaseCharges--;showToast('冰镜触发 · 穿过障碍','rare');}

 if(collision&&rewindCharges>0&&moveHistory.length>=2){
  rewindCharges--;
  const previous=moveHistory[moveHistory.length-2];
  snake=previous.snake.map(p=>({...p}));dir={...previous.dir};nextDir={...dir};
  moveHistory=moveHistory.slice(0,-1);
  showToast('时砂回溯 · 已撤回上一步','rare');playSfx('unlock');updateScores();draw();return;
 }
 if(collision&&shieldCharges>0){
  shieldCharges--;shieldUsedThisWorld=true;
  const escape=safeTurnForShield();
  if(escape){
   dir={...escape};nextDir={...escape};head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
   atExit=head.x===WORLDS[worldIndex].exit.x&&head.y===WORLDS[worldIndex].exit.y;
   eating=!!food&&head.x===food.x&&head.y===food.y;
   collecting=!!relic&&head.x===relic.x&&head.y===relic.y;
   body=(eating||growPending>0)?snake:snake.slice(0,-1);
   const stillBad=head.x<=0||head.x>=GRID-1||head.y<=1||head.y>=GRID-1||body.some(p=>p.x===head.x&&p.y===head.y)||obstacles.some(p=>p.x===head.x&&p.y===head.y)||(atExit&&!exitOpen);
   if(stillBad){v10RespawnAfterShield();updateScores();draw();return;}
   showToast('护盾触发 · 抵挡一次碰撞','epic');playSfx('unlock');
  }else{
   v10RespawnAfterShield();updateScores();draw();return;
  }
 }else if(collision){
  finishGame(false);return;
 }

 if(atExit&&exitOpen){advanceWorld();return;}
 snake.unshift(head);
 if(eating){
  let points=1+(bonusFoodCount>0?1:0)+(honeyFoods>0?2:0);
  score+=points;if(bonusFoodCount>0)bonusFoodCount--;if(honeyFoods>0)honeyFoods--;
  worldFood=Math.min(FOODS_PER_WORLD,worldFood+1);runFoodCount++;runWorldFoodCount++;
  addParticles(food.x,food.y);playSfx('eat');
  if(score>best&&gameMode!=='endless'){best=score;newRecord=true;storage.setItem('neonSnakeBest',String(best));}
  if(!exitOpen&&worldFood>=FOODS_PER_WORLD){exitOpen=true;unlockAchievement('first_exit');showToast('出口已开启 · 可继续探索','rare');playSfx('unlock');}
  food=spawnFood();
  v10CheckTasks();
  v10CheckDrop();
  if(!food){finishGame(false);return;}
 }else if(growPending>0)growPending--;else snake.pop();

 if(collecting&&relic){
  const item=relic.item;addParticles(relic.x,relic.y);relic=null;relicsCollectedThisWorld++;
  collectRelic(item);
  v10CheckTasks();
 }
 if(magnetTicks>0&&food){
  const h=snake[0],distance=Math.abs(food.x-h.x)+Math.abs(food.y-h.y);
  if(distance<=7){
   const candidates=[{x:food.x+(h.x>food.x?1:h.x<food.x?-1:0),y:food.y},{x:food.x,y:food.y+(h.y>food.y?1:h.y<food.y?-1:0)}];
   const next=candidates.find(p=>p.x>0&&p.x<GRID-1&&p.y>1&&p.y<GRID-1&&!obstacles.some(o=>o.x===p.x&&o.y===p.y)&&!snake.some(s=>s.x===p.x&&s.y===p.y)&&(!relic||relic.x!==p.x||relic.y!==p.y)&&(p.x!==WORLDS[worldIndex].exit.x||p.y!==WORLDS[worldIndex].exit.y));
   if(next)food=next;
  }
 }
 const speedBefore=speedTicks,slowBefore=slowTicks;
 if(speedTicks>0)speedTicks--;
 if(slowTicks>0)slowTicks--;
 if(magnetTicks>0)magnetTicks--;
 if(compassTicks>0)compassTicks--;
 moveHistory.push({snake:snake.map(p=>({...p})),dir:{...dir}});
 if(moveHistory.length>8)moveHistory.shift();
 updateScores();
 if(gameTimer&&((speedBefore>0&&speedTicks===0)||(slowBefore>0&&slowTicks===0)))startGameLoop();
}
